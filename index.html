<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Link Shortener</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: url('https://t4.ftcdn.net/jpg/13/33/12/19/360_F_1333121937_i9BEgu41l2awnerKK5V3s7Bgg0zEpnx6.jpg') no-repeat center center fixed;
      background-size: cover;
    }
    .glass {
      backdrop-filter: blur(12px);
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 text-white">

  <div class="glass max-w-xl w-full p-8 rounded-2xl shadow-2xl text-center space-y-6">
    <h1 class="text-4xl font-bold animate-pulse">🔗 Link Shortener</h1>

    <input id="longUrl" type="text" placeholder="Paste your long URL here..." 
           class="w-full px-4 py-3 rounded-xl bg-white/20 text-white placeholder-white focus:outline-none focus:ring-2 focus:ring-blue-400 transition" />

    <button onclick="shortenURL()" 
            class="w-full bg-blue-600 hover:bg-blue-700 transition px-4 py-2 rounded-xl font-semibold text-lg mt-2">Shorten</button>

    <div id="result" class="mt-6 hidden">
      <p class="text-xl font-semibold">Your Short Link:</p>
      <a id="shortUrl" href="#" target="_blank" 
         class="text-blue-300 underline text-lg mt-2 block hover:text-blue-400 transition"></a>
      <button onclick="copyToClipboard()" 
              class="mt-3 bg-green-600 hover:bg-green-700 transition px-4 py-2 rounded-xl">📋 Copy</button>
    </div>
  </div>

  <script>
    function generateShortCode(length = 6) {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      let code = "";
      for (let i = 0; i < length; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    function shortenURL() {
      const input = document.getElementById("longUrl");
      const originalURL = input.value.trim();

      if (!originalURL || !/^https?:\/\//i.test(originalURL)) {
        alert("Please enter a valid URL starting with http:// or https://");
        return;
      }

      const shortCode = generateShortCode();
      const shortURL = `https://short.ly/${shortCode}`; // Corrected template literal

      const linkElement = document.getElementById("shortUrl");
      linkElement.textContent = shortURL;
      linkElement.href = shortURL;

      document.getElementById("result").classList.remove("hidden");
    }

    function copyToClipboard() {
      const shortText = document.getElementById("shortUrl").textContent;
      navigator.clipboard.writeText(shortText).then(() => {
        alert("Copied to clipboard!");
      }).catch(() => {
        alert("Failed to copy.");
      });
    }
  </script>

</body>
</html>
